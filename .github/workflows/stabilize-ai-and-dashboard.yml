name: Stabilize AI and dashboard

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot for fast AI replies
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('bot.py')
          s = p.read_text()
          s = re.sub(r"AI_TIMEOUT\s*=\s*\d+", "AI_TIMEOUT = 18", s, count=1)
          start = s.find('def model_candidates():')
          end = s.find('\ndef ai_reply(', start)
          if start != -1 and end != -1:
              s = s[:start] + "def model_candidates():\n    # Ignore stale Render env model values and use only current stable models.\n    return ['gemini-3.5-flash-lite', 'gemini-3.6-flash', 'gemini-3.1-flash-lite']\n" + s[end:]
          start = s.find('def ai_reply(')
          if start == -1:
              raise SystemExit('ai_reply not found')
          end = s.find('\ndef ', start + 5)
          if end == -1:
              end = len(s)
          new_func = '''def ai_reply(user_text, chat_id):
    quick = quick_reply(user_text)
    if quick:
        return quick
    official_data = official_source_for(user_text)
    models = model_candidates()
    last_error = None
    tried_models = []
    for index, model in enumerate(models):
        tried_models.append(model)
        attempts = 2 if index == 0 else 1
        for attempt in range(attempts):
            try:
                answer = request_gemini(user_text, chat_id, model, official_data)
                logging.info('Gemini success model=%s attempt=%s', model, attempt + 1)
                return answer
            except Exception as exc:
                last_error = exc
                logging.warning('Gemini request failed model=%s attempt=%s: %s', model, attempt + 1, exc)
                if not is_transient(exc) or attempt + 1 >= attempts:
                    break
                time.sleep(0.6)
    logging.error('AI unavailable after failover: %s', last_error)
    notify_admin_ai_failure(user_text, chat_id, last_error, tried_models)
    return 'अभी AI service से जवाब नहीं मिल पा रहा है। कृपया थोड़ी देर बाद फिर कोशिश करें।'
'''
          s = s[:start] + new_func + s[end:]
          s = s.replace("'temperature': 0.2", "'temperature': 1.0", 1)
          s = s.replace("return 'This bot is made and powered by KESHAV MADHAV.'", "return 'यह Uniraj Information Section bot है।'", 1)
          p.write_text(s)
          PY
          python -m py_compile bot.py
      - name: Commit patched bot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          if git diff --cached --quiet; then echo 'No change needed'; else git commit -m 'Speed up Gemini replies and harden failover'; git push; fi
