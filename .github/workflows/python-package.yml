name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Repair bot.py
      run: |
        python - <<'PY'
        from pathlib import Path
        p = Path("bot.py")
        s = p.read_text(encoding="utf-8")
        marker = "# ADMIN_AI_FAILURE_ALERT_V1"
        menu = "def configure_telegram_menu():"
        start = s.find(marker)
        end = s.find(menu, start)
        if start >= 0 and end >= 0:
            prefix = s[:s.rfind("\n", 0, start)]
            helper = '''\n\n# ADMIN_AI_FAILURE_ALERT_V1\ndef notify_admin_ai_failure(user_text, chat_id, last_error, tried_models):\n    alert = (\n        "🚨 Gemini AI Failure\\n\\n"\n        f"👤 Chat ID: {chat_id}\\n"\n        f"❓ Student question:\\n{user_text[:2500]}\\n\\n"\n        f"🤖 Models tried: {', '.join(tried_models)}\\n"\n        f"⚠️ Error: {str(last_error)[:1200]}"\n    )\n    for admin_id in ADMIN_IDS:\n        try:\n            send_message(admin_id, alert)\n        except Exception as exc:\n            logging.warning("Could not notify admin about AI failure: %s", exc)\n'''
            s = prefix + helper + "\n" + s[end:]
        ai = s.find("def ai_reply(user_text, chat_id):")
        promo = s.find("# ================= INDIRECT CHANNEL PROMOTION =================", ai)
        if ai >= 0 and promo >= 0:
            new_ai = '''def ai_reply(user_text, chat_id):\n    quick = quick_reply(user_text)\n    if quick:\n        return quick\n    official_data = official_source_for(user_text)\n    models = [GEMINI_MODEL]\n    if "gemini-3.1-flash-lite" not in models:\n        models.append("gemini-3.1-flash-lite")\n    last_error = None\n    for model in models:\n        for delay in [0.0, 0.8, 1.8, 3.5]:\n            if delay:\n                time.sleep(delay)\n            try:\n                answer = request_gemini(user_text, chat_id, model, official_data)\n                logging.info("Gemini success model=%s", model)\n                return answer\n            except Exception as exc:\n                last_error = exc\n                logging.warning("Gemini request failed model=%s: %s", model, exc)\n                if not is_transient(exc):\n                    break\n    logging.error("AI unavailable after failover: %s", last_error)\n    notify_admin_ai_failure(user_text, chat_id, last_error, models)\n    return "अभी जवाब तैयार करने में थोड़ी तकनीकी देरी हो रही है। कृपया कुछ सेकंड बाद अपना सवाल फिर भेजें।"\n'''
            s = s[:ai] + new_ai + "\n" + s[promo:]
        p.write_text(s, encoding="utf-8")
        PY
        python -m py_compile bot.py
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: pytest
