name: Enable persistent Postgres database

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch bot for DATABASE_URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text()
          start = s.index('# ================= USER DATABASE =================')
          end = s.index('# ================= UNIRAJ SOURCES =================')
          new_block = r'''# ================= USER DATABASE =================
DATABASE_URL = (os.getenv("DATABASE_URL") or "").strip()
DB_PATH = os.getenv("USER_DB_PATH", "/var/data/users.db")

if DATABASE_URL:
    import psycopg2


def db_connect():
    if DATABASE_URL:
        conn = psycopg2.connect(DATABASE_URL, connect_timeout=10, sslmode="require")
        cur = conn.cursor()
        cur.execute("CREATE TABLE IF NOT EXISTS users (chat_id BIGINT PRIMARY KEY, username TEXT, first_name TEXT, active INTEGER DEFAULT 1, created_at DOUBLE PRECISION, last_seen DOUBLE PRECISION)")
        conn.commit()
        cur.close()
        return conn
    conn = sqlite3.connect(DB_PATH, timeout=10)
    conn.execute("CREATE TABLE IF NOT EXISTS users (chat_id INTEGER PRIMARY KEY, username TEXT, first_name TEXT, active INTEGER DEFAULT 1, created_at REAL, last_seen REAL)")
    conn.commit()
    return conn


def db_execute(conn, sql, params=(), fetch=None):
    if DATABASE_URL:
        cur = conn.cursor()
        cur.execute(sql.replace("?", "%s"), params)
        if fetch == "one":
            result = cur.fetchone()
        elif fetch == "all":
            result = cur.fetchall()
        else:
            result = None
        cur.close()
        return result
    cur = conn.execute(sql, params)
    if fetch == "one":
        return cur.fetchone()
    if fetch == "all":
        return cur.fetchall()
    return None


def register_user(user, chat_id):
    now = time.time()
    try:
        conn = db_connect()
        db_execute(conn, "INSERT INTO users(chat_id, username, first_name, active, created_at, last_seen) VALUES(?,?,?,?,?,?) ON CONFLICT(chat_id) DO UPDATE SET username=excluded.username, first_name=excluded.first_name, active=1, last_seen=excluded.last_seen", (chat_id, user.get("username", ""), user.get("first_name", ""), 1, now, now))
        conn.commit(); conn.close()
    except Exception:
        logging.exception("User registration failed")


def get_active_users():
    conn = db_connect(); rows = db_execute(conn, "SELECT chat_id FROM users WHERE active=1", fetch="all"); conn.close(); return [r[0] for r in rows]


def mark_user_inactive(chat_id):
    try:
        conn = db_connect(); db_execute(conn, "UPDATE users SET active=0 WHERE chat_id=?", (chat_id,)); conn.commit(); conn.close()
    except Exception:
        logging.exception("Could not deactivate user")


def user_count():
    conn = db_connect(); total = db_execute(conn, "SELECT COUNT(*) FROM users WHERE active=1", fetch="one")[0]; conn.close(); return total


def total_user_count():
    conn = db_connect(); total = db_execute(conn, "SELECT COUNT(*) FROM users", fetch="one")[0]; conn.close(); return total


def user_directory(page=1, per_page=25):
    page = max(1, int(page))
    offset = (page - 1) * per_page
    conn = db_connect()
    rows = db_execute(conn, "SELECT chat_id, username, first_name, active, created_at, last_seen FROM users ORDER BY last_seen DESC LIMIT ? OFFSET ?", (per_page, offset), fetch="all")
    conn.close()
    return rows

'''
          p.write_text(s[:start] + new_block + s[end:])
          PY

      - name: Add PostgreSQL driver
        run: |
          grep -qxF 'psycopg2-binary>=2.9,<3' requirements.txt || echo 'psycopg2-binary>=2.9,<3' >> requirements.txt

      - name: Syntax check
        run: python -m py_compile bot.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py requirements.txt
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add persistent PostgreSQL user database support"
            git push
          fi
