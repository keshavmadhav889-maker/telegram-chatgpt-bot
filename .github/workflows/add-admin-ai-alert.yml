name: Add admin AI failure alert

on:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - '.github/workflows/add-admin-ai-alert.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch bot.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          marker = '# ADMIN_AI_FAILURE_ALERT_V1'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          helper = r'''\n\n# ADMIN_AI_FAILURE_ALERT_V1\ndef notify_admin_ai_failure(user_text, chat_id, last_error, tried_models):\n    alert = (\n        "🚨 Gemini AI Failure\n\n"\n        f"👤 Chat ID: {chat_id}\n"\n        f"❓ Student question:\n{user_text[:2500]}\n\n"\n        f"🤖 Models tried: {', '.join(tried_models)}\n"\n        f"⚠️ Error: {str(last_error)[:1200]}"\n    )\n    for admin_id in ADMIN_IDS:\n        try:\n            send_message(admin_id, alert)\n        except Exception as exc:\n            logging.warning("Could not notify admin about AI failure: %s", exc)\n'''
          # Insert helper after send_message so it can call the Telegram sender.
          anchor = '\ndef configure_telegram_menu():'
          if anchor not in s:
              raise SystemExit('anchor not found')
          s = s.replace(anchor, helper + anchor, 1)
          start = s.index('def ai_reply(user_text, chat_id):')
          end = s.index('\n# ================= INDIRECT CHANNEL PROMOTION =================', start)
          new_func = r'''def ai_reply(user_text, chat_id):\n    quick = quick_reply(user_text)\n    if quick:\n        return quick\n    official_data = official_source_for(user_text)\n    models = [GEMINI_MODEL]\n    if "gemini-3.1-flash-lite" not in models:\n        models.append("gemini-3.1-flash-lite")\n    last_error = None\n    for model in models:\n        for delay in [0.0, 0.8, 1.8, 3.5]:\n            if delay:\n                time.sleep(delay)\n            try:\n                answer = request_gemini(user_text, chat_id, model, official_data)\n                logging.info("Gemini success model=%s", model)\n                return answer\n            except Exception as exc:\n                last_error = exc\n                logging.warning("Gemini request failed model=%s: %s", model, exc)\n                if not is_transient(exc):\n                    break\n    logging.error("AI unavailable after failover: %s", last_error)\n    notify_admin_ai_failure(user_text, chat_id, last_error, models)\n    return "अभी जवाब तैयार करने में थोड़ी तकनीकी देरी हो रही है। कृपया कुछ सेकंड बाद अपना सवाल फिर भेजें।"\n'''
          s = s[:start] + new_func + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched bot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git diff --cached --quiet || git commit -m 'Alert admin on Gemini failures'
          git push
